<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CV</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Guardado</p>
      <h1>CV</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="hidden">
      <header>
        <div><p class="eyebrow">Vista simple</p><h1>CV</h1></div>
        <div class="who"><strong id="user-name"></strong><button id="logout" class="ghost" type="button">Salir</button></div>
      </header>
      <div class="layout">
        <form id="cv-form" class="card form">
          <input id="name" placeholder="Nombre" maxlength="60" required />
          <input id="role" placeholder="Rol" maxlength="80" />
          <textarea id="summary" placeholder="Resumen" maxlength="500"></textarea>
          <textarea id="skills" placeholder="Habilidades" maxlength="500"></textarea>
          <textarea id="experience" placeholder="Experiencia" maxlength="2000"></textarea>
          <div class="row"><button class="primary" type="submit">Guardar</button><button id="new-cv" class="ghost" type="button">Nuevo</button></div>
        </form>
        <article id="preview" class="card preview"></article>
      </div>
      <p id="form-error" class="error" hidden></p>
      <ul id="list"></ul>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
